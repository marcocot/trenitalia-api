[project]
name = "trenitalia-api"
version = "0.2.0"
description = "Async + sync Python client for the public ViaggiaTreno (Trenitalia) API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Marco Cotrufo" }]
requires-python = ">=3.11"
keywords = ["trenitalia", "viaggiatreno", "trains", "italy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "selectolax>=0.3.21",
]

[project.urls]
Repository = "ssh://git@git.homelab.devncode.it:2222/marco/trenitalia-api.git"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trenitalia_api"]

# ----------------------------------------------------------------------------
# Ruff (lint only — black does formatting)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "PT", "RUF", "SIM", "TC", "C4", "ASYNC",
]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Pydantic resolves annotations at runtime via get_type_hints, so types
# referenced by model fields must stay importable at module scope.
"src/trenitalia_api/models.py" = ["TC001", "TC002", "TC003"]

# ----------------------------------------------------------------------------
# Black
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ----------------------------------------------------------------------------
# Mypy (strict)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["selectolax", "selectolax.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests/unit"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: hits the real ViaggiaTreno API (skipped by default)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=trenitalia_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/trenitalia_api"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
